name: build-windows

# 每次推送和 PR 都在 Windows 上跑测试、打一个测试包（在 Actions 页面下载）。
# 正式发布用 release.yml。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          pip install -r requirements.txt pytest
          python -m pytest tests -q
      - name: Build
        run: |
          pip install pyinstaller
          python -m PyInstaller --noconfirm --clean --windowed --name ShiYing --icon assets\icon.ico --add-data "web;web" main.py
          Compress-Archive -Path dist\ShiYing -DestinationPath ShiYing-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ShiYing-windows-x64
          path: ShiYing-windows-x64.zip
