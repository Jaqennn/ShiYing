<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拾影</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <header class="top">
    <div class="seal" aria-label="拾影"><span>拾</span><span>影</span></div>
    <form class="intake" id="intake" autocomplete="off">
      <input id="link" type="text" spellcheck="false"
             placeholder="粘贴视频链接或分享文本，回车解析">
      <button type="button" class="ghost" id="pasteBtn" title="从剪贴板粘贴并解析 (Ctrl+V)">粘贴</button>
      <button type="submit" class="ink" id="parseBtn">解析</button>
    </form>
    <button class="icon" id="settingsBtn" title="设置" aria-label="设置">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <div class="hints">
    <div class="clip-hint" id="clipHint" hidden></div>
    <div class="banner" id="setupBanner" hidden></div>
  </div>

  <section class="slip" id="slip" hidden aria-live="polite"></section>

  <main class="queue">
    <div class="queue-head">
      <nav class="filters" id="filters">
        <button data-f="all" class="on">全部</button>
        <button data-f="active">进行中 <em id="cntActive"></em></button>
        <button data-f="done">已完成</button>
        <button data-f="failed">失败</button>
      </nav>
      <div class="queue-tools">
        <button class="text" id="localSubBtn">给本地视频加字幕</button>
        <button class="text" id="openDirBtn">打开下载文件夹</button>
        <button class="text" id="clearBtn">清除已结束</button>
      </div>
    </div>
    <ol class="rows" id="rows"></ol>
    <div class="empty" id="empty" hidden>
      <p class="empty-title">复制一个视频链接，回到这里</p>
      <p>窗口会自动认出剪贴板里的链接。支持 YouTube、哔哩哔哩、X、抖音，也可以试试其他网站。</p>
    </div>
  </main>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2>设置</h2>
      <button class="icon" id="closeDrawer" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="1.8" fill="none"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="settingsBody"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
